name: Playwright in Docker (GitHub Actions)

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Run Playwright tests inside Playwright container
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble

    env:
      HOME: /root

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: npm ci
      
      - name: Print versions (debug)
        run: |
          node -v
          npm -v
          npx playwright --version

      - name: Ensure Playwright browsers
        run: npx playwright install

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          TEST_CREDENTIALS_USERNAME: ${{ secrets.TEST_CREDENTIALS_USERNAME }}
          TEST_CREDENTIALS_PASSWORD: ${{ secrets.TEST_CREDENTIALS_PASSWORD }}
        run: npx playwright test

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
